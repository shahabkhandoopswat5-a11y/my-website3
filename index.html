 tests on brushed aluminum surfaces followed by 3D wind-tunnel shader prototypes.`,design:`Custom sans-serif typeface cut with 12-degree forward aero angles and ultraviolet micro-accents.`,solution:`A cohesive brand identity system covering digital cockpit UI, investor monographs, launch web platform, and vehicle livery.`,deliverables:[`Custom Brand Identity`,`Design System & Token Kit`,`Cockpit UI Prototype`,`Global Launch Platform`],metrics:[`+420% Investor Inquiries`,`Awwwards Site of the Day (Demo)`,`100% Custom Typography`],gallery:[`https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=80`,`https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-2`,title:`ATELIER VÉLOCE`,clientType:`Swiss Mechanical Horology`,year:`2024 · DEMO`,category:`Web`,heroImage:`https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=1200&q=80`,challenge:`Translate the microscopic mechanical complexity of a double-tourbillon chronograph into a sub-second web experience.`,concept:`Temporal stillness. An interface where time dictates typography weight and gear-teeth mesh with cursor movements.`,process:`High-resolution macro-photography paired with WebGL gear physics that respond to user scroll inertia.`,design:`Warm monochrome slate tones, serif luxury numerals, and hair-thin dividing lines resembling watchmaker loupe crosshairs.`,solution:`A responsive digital flagship that allows collectors to inspect balance wheels at 40x magnification with zero latency.`,deliverables:[`Macro Watchmaker Experience`,`Interactive 3D Complication Explorer`,`VIP Allocation Portal`],metrics:[`12 Tourbillons Pre-Ordered`,`3.8s Average Dwell Time`,`FWA of the Day (Demo)`],gallery:[`https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=1200&q=80`,`https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-3`,title:`SOLIS BOTANICA`,clientType:`Regenerative Skincare Monograph`,year:`2024 · DEMO`,category:`Campaign`,heroImage:`https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=1200&q=80`,challenge:`Position a cold-pressed botanical serum as a scientific biotech breakthrough rather than a generic hippie cosmetic.`,concept:`Microbial poetry. Macro photography of cell membrane hydration paired with rigorous clinical laboratory data.`,process:`Collaborated with plant biochemists to turn spectrophotometer wavelength readings into interactive color gradients.`,design:`Earthy travertine background, sage and moss typography, and clinical medical grid layouts.`,solution:`A sensorial interactive e-commerce monograph that educates consumers on molecular dermal absorption.`,deliverables:[`Brand Narrative Strategy`,`Packaging & Box Architecture`,`Ingredient Discovery Engine`],metrics:[`+185% D2C Conversion`,`D&AD Pencil Nominee (Demo)`,`Zero Plastic Packaging`],gallery:[`https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-4`,title:`MONOLITH SOUND`,clientType:`Audiophile Acoustic Sculptures`,year:`2025 · DEMO`,category:`Digital`,heroImage:`https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=1200&q=80`,challenge:`Sell $35,000 cast-concrete loudspeakers purely online without the buyer physically hearing the acoustic room response.`,concept:`Visualizing invisible pressure waves. Sound visualized as fluid particulate physics that distort typography.`,process:`Acoustic room simulation where visitors drag speakers across virtual living rooms to see standing bass wave nodes.`,design:`Pure brutalist black-and-white canvas with acid yellow audio decibel meters and technical schematics.`,solution:`An acoustic configurator allowing collectors to simulate frequency dispersion in their specific room dimensions.`,deliverables:[`Acoustic Dispersion Web App`,`Direct-to-Studio Booking Funnel`,`Physical Sound Monograph`],metrics:[`Sold Out Batch 01 in 48hrs`,`Webby Honoree (Demo)`,`60fps Canvas Simulation`],gallery:[`https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-5`,title:`SYNAPSE NEURAL`,clientType:`Brain-Computer Interface Research`,year:`2024 · DEMO`,category:`Motion`,heroImage:`https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80`,challenge:`Explain complex multi-electrode array signal processing to academic peer reviewers and institutional venture partners.`,concept:`Synaptic latency. Smooth kinetic line drawings that morph from raw brainwave spikes into clean vector iconography.`,process:`Interviewed neurosurgeons and EEG technicians to accurately render spike sorting and wave frequency filtering.`,design:"Deep midnight blue `#0B0F19` with neon cyan `#00F0FF` signal traces and high-density technical footnotes.",solution:`An interactive research portal that lets scientists run live demo neural decoding benchmarks directly in the browser.`,deliverables:[`Interactive Neural Decoder Sandbox`,`Academic Whitepaper Layout`,`Investor Pitch Experience`],metrics:[`$18M Series A Raised`,`Nature Biotechnology Featured (Demo)`],gallery:[`https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-6`,title:`VOXEL ARCHIVES`,clientType:`Digital Museum of Generative Art`,year:`2025 · DEMO`,category:`Experimental`,heroImage:`https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1200&q=80`,challenge:`Archive 10,000 on-chain generative art outputs without crashing mobile WebGL viewports.`,concept:`Infinite spatial canvas. Quadtree spatial indexing that clusters artworks into galaxies as users zoom out.`,process:`Custom GLSL shaders compressing 4K canvas renders into lightweight mipmapped sprite sheets.`,design:`Minimalist museum curation with zero clutter; only the artwork and small mono catalog metadata.`,solution:`A gallery experience supporting 60fps pinch-to-zoom across thousands of historical generative algorithm milestones.`,deliverables:[`High-Performance WebGL Canvas`,`Spatial Search Index`,`Curator Commentary Audio Player`],metrics:[`1.2M Virtual Visitors`,`Average Session 9.4 mins`],gallery:[`https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-7`,title:`ARCHETYPE 07`,clientType:`Experimental Streetwear Monograph`,year:`2024 · DEMO`,category:`Branding`,heroImage:`https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=1200&q=80`,challenge:`Stand out in an oversaturated streetwear landscape through extreme digital minimalism and anti-commercial pacing.`,concept:`Deconstruction. Garments showcased as textile technical sheets with thread-count breakdowns.`,process:`Flatbed high-resolution scans of Japanese selvedge denim and ripstop nylon fabrics.`,design:`Raw industrial Swiss typography, stencil numbering, and monochrome stark contrast.`,solution:`A secret release mechanism where visitors decipher garment coordinate codes to access drop allocations.`,deliverables:[`Digital Release Portal`,`Garment Technical Lookbook`,`SMS Drop Alert Infrastructure`],metrics:[`Drop Sold Out in 90 Seconds`,`Over 40k Pre-Registrations`],gallery:[`https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-8`,title:`LUMINA KINETICS`,clientType:`Architectural Dynamic Lighting`,year:`2025 · DEMO`,category:`Web`,heroImage:`https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80`,challenge:`Demonstrate how motorized architectural louvers and LED light pipes transform airport terminals and skyscrapers.`,concept:`Simulated circadian rhythm. The entire website shifts color temperature and shadow angles matching the visitor’s local sun.`,process:`Connected user IP geolocation to solar altitude calculations to cast real-time responsive CSS box-shadows.`,design:`Architectural wireframe overlays with real-time lux-meter readouts and energy reduction statistics.`,solution:`An executive portal for global architects to specify dynamic lighting installations for high-profile public tenders.`,deliverables:[`Circadian Solar Web Engine`,`Architect Specification Download Hub`,`Tender Showcase`],metrics:[`3 International Airport Tenders Won`,`Global Design Award (Demo)`],gallery:[`https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-9`,title:`TERRA FORMA`,clientType:`Regenerative Agriculture Fund`,year:`2024 · DEMO`,category:`Digital`,heroImage:`https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=80`,challenge:`Convince institutional pension funds to allocate $500M into topsoil restoration and regenerative farmland.`,concept:`Living soil. Interactive satellite depth heatmaps demonstrating organic carbon soil sequestration over 30 years.`,process:`Normalized GIS satellite raster datasets into responsive vector choropleths that scrub smoothly across time.`,design:`Rich organic silt and loam palette with emerald highlights and strict financial data tables.`,solution:`An institutional investor portal proving that ecological soil restoration yields superior risk-adjusted financial returns.`,deliverables:[`GIS Satellite Soil Interactive`,`Investor Due Diligence Room`,`Annual Impact Monograph`],metrics:[`$320M Committed Capital`,`Impact ESG Gold Standard`],gallery:[`https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=80`]},{id:`proj-10`,title:`AURA SPATIAL`,clientType:`Next-Gen Mixed Reality OS`,year:`2025 · DEMO`,category:`Motion`,heroImage:`https://images.unsplash.com/photo-1592478411213-6153e4ebc07d?auto=format&fit=crop&w=1200&q=80`,challenge:`Design the developer guidelines and spatial human interface documentation for a revolutionary lightweight AR headset.`,concept:`Spatial physics. Windows with realistic mass, gravitational dampening, and eye-tracking raycast targets.`,process:`100+ gesture recording tests analyzing arm fatigue and microscopic saccadic eye movements.`,design:`Translucent refractive glassmorphism with crisp high-contrast text that maintains legibility against any physical room.`,solution:`The complete interactive design constitution and developer playground for the upcoming spatial computing platform.`,deliverables:[`Spatial Human Interface Guidelines`,`Interactive Web Playground`,`Developer SDK Portal`],metrics:[`Adopted by 15,000+ Developers`,`Design Standard of the Year (Demo)`],gallery:[`https://images.unsplash.com/photo-1592478411213-6153e4ebc07d?auto=format&fit=crop&w=1200&q=80`]}],cn=[{name:`Kaspar Lind`,role:`Creative Director & Founder`,bio:`Pioneering generative typography, digital physics, and brutalist web architecture since 2016.`,image:`https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80`},{name:`Mia Solis`,role:`Lead Interaction Architect`,bio:`Specialist in 60fps GPU micro-interactions, spatial layout systems, and human-computer kinetics.`,image:`https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80`},{name:`Ryo Takahashi`,role:`Head of Creative Engineering`,bio:`Crafting WebGL shaders, real-time procedural animations, and zero-bloat front-end code.`,image:`https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80`}],ln=()=>{let[e,t]=(0,b.useState)(`home`),[n,r]=(0,b.useState)(null),[i,a]=(0,b.useState)(`All`),[o,s]=(0,b.useState)(`TYPOGRAPHY AS GRAVITY`),[c,l]=(0,b.useState)(16),[u,d]=(0,b.useState)(50),[f,p]=(0,b.useState)(null),[m,h]=(0,b.useState)(!1),[g,_]=(0,b.useState)([]),[v,y]=(0,b.useState)(0),ee=(e,t=0)=>{_(e),y(t),h(!0)},S=i===`All`?sn:sn.filter(e=>e.category===i);return(0,x.jsxs)(`div`,{className:`min-h-screen bg-[#0A0A0C] text-[#E4E4E7] font-sans antialiased selection:bg-[#
